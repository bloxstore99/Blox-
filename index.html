<!DOCTYPE html>
<html lang="en" id="html-root" class="theme-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOX STORE | Tactical Streetwear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s, color 0.3s; }

        /* Theme Definitions */
        .theme-black { background-color: #000000; color: #ffffff; }
        .theme-black .card-bg { background-color: #0a0a0a; border-color: #1a1a1a; }
        .theme-black .nav-bg { background-color: rgba(0,0,0,0.9); }
        .theme-black .accent-btn { background-color: #ffffff !important; color: #000000 !important; }

        .theme-red { background-color: #0a0000; color: #ffcccc; }
        .theme-red .card-bg { background-color: #1a0505; border-color: #330d0d; }
        .theme-red .nav-bg { background-color: rgba(10,0,0,0.9); }
        .theme-red .accent-btn { background-color: #b30000 !important; color: #fff !important; }

        .theme-blue { background-color: #020813; color: #e0f2fe; }
        .theme-blue .card-bg { background-color: #07152d; border-color: #0f2d59; }
        .theme-blue .nav-bg { background-color: rgba(2,8,19,0.9); }
        .theme-blue .accent-btn { background-color: #0284c7 !important; color: #fff !important; }

        .theme-white { background-color: #f8fafc; color: #0f172a; }
        .theme-white .card-bg { background-color: #ffffff; border-color: #e2e8f0; }
        .theme-white .nav-bg { background-color: rgba(248,250,252,0.9); }
        .theme-white .accent-btn { background-color: #0f172a !important; color: #fff !important; }

        .theme-brown { background-color: #120c08; color: #f5ebe0; }
        .theme-brown .card-bg { background-color: #1f140d; border-color: #332218; }
        .theme-brown .nav-bg { background-color: rgba(18,12,8,0.9); }
        .theme-brown .accent-btn { background-color: #8c5830 !important; color: #fff !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-neutral-800 sticky top-0 nav-bg backdrop-blur z-50 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2 cursor-pointer">
            <div class="w-9 h-9 rounded-xl bg-white text-black font-extrabold flex items-center justify-center text-lg tracking-tighter">B</div>
            <span class="font-bold tracking-widest text-sm md:text-base">BLOX STORE</span>
        </div>
        
        <!-- Header Actions -->
        <div class="flex items-center space-x-2">
            <!-- Public Theme Switcher Dropdown -->
            <select id="theme-selector" onchange="changeTheme(this.value)" class="card-bg border text-xs font-semibold px-2 py-2 rounded-xl outline-none cursor-pointer">
                <option value="black">🖤 Black</option>
                <option value="red">🩸 Red</option>
                <option value="blue">🌊 Underwater</option>
                <option value="white">🤍 White</option>
                <option value="brown">🤎 Brown</option>
            </select>

            <button onclick="openCart()" class="relative p-2 card-bg border rounded-xl transition">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-white text-black text-xs font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
            <button onclick="openAdminLogin()" class="p-2 card-bg border rounded-xl transition text-xs font-semibold">
                <i class="fa-solid fa-lock"></i>
            </button>
        </div>
    </header>

    <!-- Main Shop Area -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-3">TACTICAL DROP</h1>
            <p class="opacity-70 text-sm max-w-md mx-auto">High-trust minimalist streetwear designed for the modern utility standard.</p>
        </div>
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Products load dynamically -->
        </div>
    </main>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 bg-black/80 z-50 hidden flex justify-end">
        <div class="card-bg w-full max-w-md p-6 h-full flex flex-col border-l">
            <div class="flex justify-between items-center pb-4 border-b">
                <h2 class="font-bold text-lg">YOUR CART</h2>
                <button onclick="closeCart()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="cart-items" class="flex-grow overflow-y-auto py-4 space-y-4"></div>
            <div class="border-t pt-4 mt-auto">
                <div class="flex justify-between font-bold mb-4">
                    <span>Total:</span>
                    <span id="cart-total">₹0</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full accent-btn font-bold py-3 rounded-xl transition mb-2">Checkout via WhatsApp</button>
                <button onclick="checkoutInstagram()" class="w-full card-bg border font-bold py-3 rounded-xl transition">Checkout via Instagram DM</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="card-bg border w-full max-w-2xl rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">ADMIN PANEL</h2>
                <button onclick="closeAdmin()" class="opacity-70 hover:opacity-100"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <!-- Add Product Form -->
            <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-4 mb-8 p-4 rounded-xl border card-bg">
                <h3 class="font-semibold text-sm mb-2">Add New Product</h3>
                <input type="text" id="p-name" placeholder="Product Name" required class="w-full card-bg border p-3 rounded-xl text-sm">
                <input type="number" id="p-price" placeholder="Price (₹)" required class="w-full card-bg border p-3 rounded-xl text-sm">
                <input type="text" id="p-image" placeholder="Image URL" required class="w-full card-bg border p-3 rounded-xl text-sm">
                <button type="submit" class="w-full accent-btn font-bold py-3 rounded-xl text-sm">Publish Product</button>
            </form>

            <h3 class="font-semibold text-sm mb-4">Manage Products</h3>
            <div id="admin-product-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="card-bg border w-full max-w-sm rounded-2xl p-6">
            <h2 class="text-lg font-bold mb-4">Admin Access (PIN: 2027)</h2>
            <input type="password" id="admin-pin-input" placeholder="Enter PIN" class="w-full card-bg border p-3 rounded-xl text-sm mb-4">
            <button onclick="verifyAdminPin()" class="w-full accent-btn font-bold py-3 rounded-xl text-sm">Login</button>
        </div>
    </div>

    <script>
        // Link pehle se hi daal di hai:
        const API_URL = "https://6aeaf47fee39618d7bf79de3.mockapi.io/Products/products";

        let cart = [];

        async function fetchProducts() {
            try {
                let res = await fetch(API_URL);
                let products = await res.json();
                renderProducts(products);
                renderAdminProducts(products);
            } catch (err) {
                console.error("Error fetching products:", err);
            }
        }

        function changeTheme(themeName) {
            const root = document.getElementById('html-root');
            root.className = `theme-${themeName}`;
            localStorage.setItem('blox_theme', themeName);
            document.getElementById('theme-selector').value = themeName;
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('blox_theme') || 'black';
            changeTheme(savedTheme);
            fetchProducts();
        };

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            if (!products || products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center opacity-50 py-12">No products found. Add products via Admin panel.</p>`;
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="card-bg border rounded-2xl overflow-hidden group">
                    <div class="aspect-[4/5] bg-neutral-950 overflow-hidden relative">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-3 md:p-4">
                        <h3 class="font-medium text-sm truncate mb-1">${p.name}</h3>
                        <p class="font-bold text-sm mb-3">₹${p.price}</p>
                        <button onclick="addToCart('${p.id}', '${p.name}', ${p.price})" class="w-full accent-btn py-2 rounded-xl text-xs font-semibold transition">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminProducts(products) {
            const list = document.getElementById('admin-product-list');
            if (!products || products.length === 0) {
                list.innerHTML = `<p class="opacity-50 text-xs">No products in inventory.</p>`;
                return;
            }
            list.innerHTML = products.map(p => `
                <div class="flex items-center justify-between card-bg p-3 rounded-xl border">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" class="w-10 h-10 object-cover rounded-lg">
                        <div>
                            <p class="text-xs font-bold">${p.name}</p>
                            <p class="text-xs opacity-70">₹${p.price}</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct('${p.id}')" class="text-red-500 text-xs px-3 py-1 bg-red-500/10 rounded-lg">Delete</button>
                </div>
            `).join('');
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = Number(document.getElementById('p-price').value);
            const image = document.getElementById('p-image').value;

            try {
                let res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, price, image })
                });
                if(res.ok) {
                    document.getElementById('product-form').reset();
                    alert('Product added successfully!');
                    fetchProducts();
                }
            } catch (error) {
                console.error("Error adding product: ", error);
            }
        }

        async function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                try {
                    let res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if(res.ok) fetchProducts();
                } catch (error) {
                    console.error("Error deleting product: ", error);
                }
            }
        }

        function openAdminLogin() { 
            document.getElementById('login-modal').classList.remove('hidden'); 
        }

        function verifyAdminPin() {
            const pin = document.getElementById('admin-pin-input').value;
            if (pin === '2027') {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-modal').classList.remove('hidden');
                document.getElementById('admin-pin-input').value = '';
            } else {
                alert('Incorrect PIN!');
            }
        }

        function closeAdmin() { document.getElementById('admin-modal').classList.add('hidden'); }
        function openCart() { document.getElementById('cart-drawer').classList.remove('hidden'); }
        function closeCart() { document.getElementById('cart-drawer').classList.add('hidden'); }

        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty++; } else { cart.push({ id, name, price, qty: 1 }); }
            updateCartUI();
            openCart();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            const itemsContainer = document.getElementById('cart-items');
            let total = 0;

            if (cart.length === 0) {
                itemsContainer.innerHTML = `<p class="text-center opacity-50 py-8 text-sm">Your cart is empty.</p>`;
                document.getElementById('cart-total').innerText = `₹0`;
                return;
            }

            itemsContainer.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="flex justify-between items-center card-bg p-3 rounded-xl border">
                        <div>
                            <p class="text-xs font-bold">${item.name}</p>
                            <p class="text-xs opacity-70">₹${item.price} x ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart('${item.id}')" class="opacity-70 hover:opacity-100 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = `₹${total}`;
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert('Cart is empty!');
            let msg = "Hello BLOX STORE, I want to order:\n";
            let total = 0;
            cart.forEach(item => {
                msg += `- ${item.name} (x${item.qty}) : ₹${item.price * item.qty}\n`;
                total += item.price * item.qty;
            });
            msg += `\nTotal Amount: ₹${total}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function checkoutInstagram() {
            if (cart.length === 0) return alert('Cart is empty!');
            window.open('https://instagram.com/blox_._store', '_blank');
        }
    </script>
</body>
</html>
